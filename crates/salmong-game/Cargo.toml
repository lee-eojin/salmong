[package]
name = "salmong-game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Not the `2d` feature: it adds `webgl2`, which plan Q2 rules out, and gilrs and
# wayland, which need pkg-config, so a native workspace build fails without it.
bevy = { version = "=0.20.1", default-features = false, features = [
    "2d_bevy_render",
    "bevy_winit",
    "default_app",
    "std",
    "webgpu",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
