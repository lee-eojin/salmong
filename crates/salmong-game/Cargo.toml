[package]
name = "salmong-game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
    "2d_bevy_render",
    "bevy_winit",
    "default_app",
    "std",
    "webgpu",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
