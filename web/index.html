<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>salmong</title>
    <script>
      (() => {
        const Real = window.AudioContext;
        if (!Real) return;
        const made = [];
        window.AudioContext = new Proxy(Real, {
          construct(target, args) {
            const ctx = new target(...args);
            made.push(ctx);
            return ctx;
          },
        });
        const wake = () => made.forEach((ctx) => ctx.state === "suspended" && ctx.resume());
        ["pointerdown", "mousedown", "keydown", "touchend"].forEach((name) =>
          window.addEventListener(name, wake, { capture: true }),
        );
        window.salmongAudio = () =>
          made.length === 0 ? "none" : made.every((ctx) => ctx.state === "running") ? "running" : "suspended";
      })();
    </script>
    <link data-trunk rel="rust" href="../crates/salmong-game/Cargo.toml" data-bin="salmong-game" data-wasm-opt="3" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <p id="no-webgpu" hidden>salmong needs WebGPU. Open it in a browser that supports WebGPU.</p>
    <script type="module">
      const adapter = await navigator.gpu?.requestAdapter({ powerPreference: "high-performance" });
      document.getElementById("no-webgpu").hidden = Boolean(adapter);
      if (adapter) {
        const { vendor, architecture, device, description, isFallbackAdapter } = adapter.info;
        const info = { vendor, architecture, device, description, isFallbackAdapter };
        console.info(`salmong: WebGPU adapter ${JSON.stringify(info)}`);
      } else {
        console.error("salmong: no WebGPU adapter");
      }
    </script>
  </body>
</html>
