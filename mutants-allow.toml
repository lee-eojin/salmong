[[allow]]
mutant = "crates/salmong-core/src/routing.rs: replace > with < in dijkstra"
reason = "The stale-entry skip only saves work. Relaxing a popped stale entry cannot lower any distance, so the result table is the same."

[[allow]]
mutant = "crates/salmong-core/src/routing.rs: replace < with <= in dijkstra"
reason = "An equal-distance relaxation stores the same value and pushes a duplicate heap entry, so the result table is the same."

[[allow]]
mutant = "crates/salmong-core/src/sim.rs: replace == with != in Sim::state_bytes"
reason = "The mode byte is derived from the overflow timers that state_bytes already writes, so flipping it inverts every hash in the same way and two states compare equal exactly when they did before."

[[allow]]
mutant = "crates/salmong-core/src/sim.rs: replace + with * in Sim::add_route"
reason = "The rev passed to the trial NetworkSnapshot only feeds validation and the trial is dropped, so its value is unobservable."

