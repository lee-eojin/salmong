name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: always

jobs:
  unit-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-unit-prs.sh
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p salmong-core --target wasm32-unknown-unknown
      - run: cargo check --locked -p salmong-pack --target wasm32-unknown-unknown
      - run: scripts/check-no-comments.sh
      - run: scripts/check-toolchain.sh
      - run: scripts/check-deps.sh
      - run: scripts/check-public-api.sh
